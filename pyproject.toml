[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ephor"
version = "0.2.0"
description = "Passive, detect-only monitor of what AI agents do on a Linux box: where they go, what they download, and what they can access."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["ai-agents", "security", "egress", "monitoring", "observability", "llm", "detect", "homelab"]
authors = [{ name = "C1 Lab" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]

# Dependency-free: Ephor uses only the Python standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/casareanderson/ephor"
Issues = "https://github.com/casareanderson/ephor/issues"

[project.scripts]
ephor = "ephor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["ephor"]

[tool.hatch.build.targets.sdist]
include = ["ephor", "tests", "README.md", "LICENSE", "ephor.toml.example"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607"]  # asserts in tests; subprocess with controlled argv
